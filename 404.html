        // Pracenje konverzija: klik na telefon, WhatsApp i mail
        document.addEventListener('click', function (ev) {
            var el = ev.target;
            if (!el || typeof el.closest !== 'function') return;
            var a = el.closest('a[href]');
            if (!a) return;
            var href = a.getAttribute('href') || '';
            var kanal = null;
            if (href.indexOf('tel:') === 0) kanal = 'telefon';
            else if (href.indexOf('mailto:') === 0) kanal = 'mail';
